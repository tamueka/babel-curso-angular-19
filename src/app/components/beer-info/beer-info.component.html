@if(beer()){
  <div class="p-card beer-card">
    <div class="p-card-header beer-card-header">
      <img [src]="imagenUrl()" alt="beer image" class="beer-img" />
    </div>
    <div class="p-card-body">
      <h1 class="p-card-title beer-title">{{ beer()?.name }}</h1>
      <p class="p-card-subtitle beer-description">{{ beer()?.description }}</p>
    </div>
  </div>
}
